; free-assets: text styles referenced by .wnd layouts via HEADERTEMPLATE = "Name".
; Names are ours; keep them in sync with the free .wnd files.
HeaderTemplate Title
  Font  = "Arial"
  Point = 24
  Bold  = Yes
End

HeaderTemplate Subtitle
  Font  = "Arial"
  Point = 16
  Bold  = Yes
End

HeaderTemplate Button
  Font  = "Arial"
  Point = 12
  Bold  = Yes
End

HeaderTemplate Label
  Font  = "Arial"
  Point = 12
  Bold  = No
End

HeaderTemplate Small
  Font  = "Arial"
  Point = 10
  Bold  = No
End
