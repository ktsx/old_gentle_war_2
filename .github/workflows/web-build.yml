name: Web Build

# Builds the WebAssembly/WebGL 2.0 port (Zero Hour) with the pinned Emscripten
# toolchain and uploads GeneralsZH.{html,js,wasm} as artifacts. This is the
# flagship CI job: if it is green, a stranger can reproduce the build from
# BUILDING.md.

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - 'merge/**'   # upstream merge steps get a CI build before landing on main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in sync with BUILDING.md. Historic builds used 3.1.74.
  EMSDK_VERSION: 6.0.2

jobs:
  build-web:
    name: Emscripten Build (GeneralsMD / Zero Hour, ${{ matrix.build_type }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # RelWithDebInfo = development profile (-O0 -g3, assertions, readable JS).
        # Release = distribution profile (-O3, Closure-minified JS, emmalloc) —
        # the only profile where minification bugs (e.g. FS/IDBFS lookups) show.
        include:
          - build_type: RelWithDebInfo
            release_tag: ci-latest
          - build_type: Release
            release_tag: ci-latest-release
    permissions:
      contents: write   # rolling "ci-latest" release (see last step)

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Ninja and ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache

      # emsdk at a fixed path (~/emsdk), cached by version. setup-emsdk put it under
      # a per-run random directory, which ends up in every compile command line
      # (-isystem …/sysroot/include) and so in every ccache hash — no hits across runs.
      - name: Cache emsdk
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-v1

      - name: Set up Emscripten
        run: |
          set -e
          if [ ! -x "$HOME/emsdk/emsdk" ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          fi
          cd "$HOME/emsdk"
          ./emsdk install "$EMSDK_VERSION"
          ./emsdk activate "$EMSDK_VERSION"
          source ./emsdk_env.sh
          env | grep -E '^(EMSDK|EMSDK_NODE|EMSDK_PYTHON|EM_CONFIG)=' >> "$GITHUB_ENV" || true
          echo "$HOME/emsdk" >> "$GITHUB_PATH"
          echo "$HOME/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
          emcc --version | head -1

      # ccache wraps the clang that emcc runs (EM_COMPILER_WRAPPER), so object
      # compiles are cached across runs; links are not. The cache is restored by
      # build type with a prefix match and saved on every run (also failed ones),
      # so a warm cache turns a ~7 min compile into ~2 min.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-v2-${{ matrix.build_type }}-emsdk${{ env.EMSDK_VERSION }}-${{ github.sha }}
          restore-keys: |
            ccache-v2-${{ matrix.build_type }}-emsdk${{ env.EMSDK_VERSION }}-

      - name: Configure ccache
        run: |
          echo "EM_COMPILER_WRAPPER=ccache" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=1G" >> "$GITHUB_ENV"
          # emsdk is reinstalled every run (new mtimes): identify the compiler by its version string
          echo "CCACHE_COMPILERCHECK=%compiler% --version" >> "$GITHUB_ENV"
          # precompiled headers need these to be cacheable
          echo "CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime" >> "$GITHUB_ENV"
          echo "CCACHE_NOHASHDIR=1" >> "$GITHUB_ENV"
          echo "CCACHE_PCH_EXTSUM=1" >> "$GITHUB_ENV"
          ccache --zero-stats

      - name: Configure (emcmake + web.cmake)
        # -G Ninja must be explicit, and CMAKE_PROJECT_INCLUDE must be an
        # absolute path — both are load-bearing (see BUILDING.md).
        run: |
          # The top-level CMakeLists.txt installs ccache as the compiler launcher
          # when it finds one (CCACHE_PROGRAM); point it at our launcher instead,
          # which runs em++ (whose inner clang is wrapped by ccache through
          # EM_COMPILER_WRAPPER) and writes <pch>.sum next to each precompiled
          # header (hash of the preprocessed PCH source) for CCACHE_PCH_EXTSUM:
          # clang PCH files are not reproducible between runs, so hashing them
          # meant no cache hits.
          emcmake cmake -G Ninja -B build-web \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DRTS_GAME=GeneralsMD \
            -DRTS_PLATFORM=web \
            -DCCACHE_PROGRAM=$PWD/scripts/ci/ccache-pch-launcher.sh \
            -DCMAKE_PROJECT_INCLUDE=$PWD/cmake/web.cmake

      - name: Build z_generals
        # Log is tee'd so the step below can surface compiler errors as
        # annotations (job logs live on blob storage that some proxies block).
        run: |
          set -o pipefail
          ninja -k 0 -C build-web z_generals 2>&1 | tee build-web/build.log

      - name: ccache statistics
        if: always()
        run: |
          ccache --show-stats | tee ccache-stats.txt
          # one line in the check-run annotations, so the hit rate is visible without the logs
          echo "::notice title=ccache (${{ matrix.build_type }})::$(ccache --show-stats | grep -E 'Hits|Misses|Cache size|Uncacheable' | tr -s ' ' | paste -sd ';' -)"

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-v2-${{ matrix.build_type }}-emsdk${{ env.EMSDK_VERSION }}-${{ github.sha }}

      - name: Surface compiler errors as annotations
        if: failure()
        run: |
          grep -nE "error:|Error:|undefined symbol|FAILED:" build-web/build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line:0:900}"
          done
          # also the 60 lines before the first error, for context
          n=$(grep -nE "error:" build-web/build.log | head -1 | cut -d: -f1)
          if [ -n "$n" ]; then
            s=$(( n > 60 ? n - 60 : 1 ))
            sed -n "${s},$((n+20))p" build-web/build.log | while IFS= read -r line; do echo "::warning::${line:0:900}"; done
          fi

      - name: Verify Outputs
        run: |
          set -e
          for f in GeneralsZH.html GeneralsZH.js GeneralsZH.wasm; do
            if [ ! -f "build-web/GeneralsMD/$f" ]; then
              echo "::error::Expected build output missing: build-web/GeneralsMD/$f"
              exit 1
            fi
          done
          ls -la build-web/GeneralsMD/GeneralsZH.*
          # --emit-symbol-map names the map after the main output (.html or .js, by emscripten
          # version); publish it under one stable name
          sym=$(ls build-web/GeneralsMD/GeneralsZH*.symbols 2>/dev/null | head -1)
          if [ -n "$sym" ]; then cp "$sym" build-web/GeneralsMD/GeneralsZH.symbols; else echo "::warning::no symbol map emitted"; fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GeneralsZH-web-${{ matrix.build_type }}
          if-no-files-found: error
          path: |
            build-web/GeneralsMD/GeneralsZH.html
            build-web/GeneralsMD/GeneralsZH.js
            build-web/GeneralsMD/GeneralsZH.wasm

      # Artifacts live on Azure blob storage, which some corporate/agent proxies
      # block. Mirror the build into a rolling pre-release so it is reachable via
      # plain github.com/<repo>/releases/download/ci-latest/<file>.
      # Pushes to main publish ci-latest / ci-latest-release; pushes to merge/** publish the same
      # files under ci-branch / ci-branch-release (one rolling slot for whichever branch built last),
      # so a branch build can be fetched and tested without merging it first.
      - name: Set up Node (launcher build)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/merge/'))
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish rolling release (${{ matrix.release_tag }})
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/merge/'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cp scripts/serve.py build-web/GeneralsMD/serve.py
          # the launcher (web/launcher): the site's index.html, service worker, manifest and icons
          node --experimental-strip-types web/launcher/build.ts launcher-dist
          TAG='${{ matrix.release_tag }}'
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then TAG="${TAG/ci-latest/ci-branch}"; fi
          gh release delete "$TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" --prerelease \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CI build ${GITHUB_SHA::7} (${{ matrix.build_type }}, ${GITHUB_REF_NAME})" \
            --notes "Automated web build of ${GITHUB_SHA} (${GITHUB_REF_NAME}, Emscripten ${EMSDK_VERSION}, ${{ matrix.build_type }}). Engine and launcher (index.html) — no game assets." \
            build-web/GeneralsMD/GeneralsZH.html \
            build-web/GeneralsMD/GeneralsZH.js \
            build-web/GeneralsMD/GeneralsZH.wasm \
            $(ls build-web/GeneralsMD/GeneralsZH.symbols 2>/dev/null) \
            build-web/GeneralsMD/serve.py \
            launcher-dist/*

  # Boots the Release build in headless Chromium with the EA-free asset set
  # (assets-free/README.md): engine must reach "Ready", the main menu must be
  # drawn and lit after the first key press. This is the first test that runs
  # the engine rather than merely compiling it.
  boot-smoke:
    name: Boot to main menu and launch a map (free assets, Release)
    needs: build-web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Release build
        uses: actions/download-artifact@v4
        with:
          name: GeneralsZH-web-Release
          path: site

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build free asset set
        run: |
          node --experimental-strip-types tools/asset-pipeline/build-free-assets.ts free-out --cache "$RUNNER_TEMP/free-cache"
          mkdir -p site/assets && cp free-out/assets/*.big free-out/assets/manifest.json site/assets/
          node --experimental-strip-types web/launcher/build.ts site
          ls -l site site/assets

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Serve and boot
        run: |
          set -o pipefail
          cp scripts/serve.py site/serve.py
          (cd site && python3 serve.py 8888 > ../serve.log 2>&1 &)
          sleep 2
          # Begin, press Space (reveals the menu), click SOLO PLAY, BACK, EXIT GAME; ?diag=1 traces must show
          # the button presses reaching MainMenuSystem and the transition gate clearing.
          SMOKE_KEYS=Space SMOKE_CLICKS="512,274;512,504;512,504" \
          SMOKE_EXPECT="GBM_SELECTED 'MainMenu.wnd:ButtonSinglePlayer';Clearing dontAllowTransitions;GBM_SELECTED 'MainMenu.wnd:ButtonExit'" \
          node tools/asset-pipeline/smoke.js "http://localhost:8888/GeneralsZH.html?diag=1" 120000 menu.png 8000 --begin | tee smoke.log

      - name: Check the menu is lit
        run: |
          set -o pipefail
          python3 -m pip install --quiet pillow
          python3 tools/asset-pipeline/check-menu-shot.py menu.png | tee menu-check.log || { sed "s/^/::error title=menu-check::/" menu-check.log; exit 1; }
          sed "s/^/::notice title=menu-check::/" menu-check.log

      - name: Launch a map
        if: always()
        run: |
          set -o pipefail
          curl -sf http://localhost:8888/GeneralsZH.html > /dev/null || { (cd site && python3 serve.py 8888 >> ../serve.log 2>&1 &); sleep 2; }
          # `-file` (CommandLine.cpp, enabled for the web build) starts the free map straight after boot;
          # the game must reach a running logic loop (TICK-DIAG inGame=1).
          SMOKE_EXPECT="GAMELOGIC: startNewGame:ENTER;inGame=1 isPaused=0" \
          # gxdraws=40: the first-frame draw dump reaches past the terrain's ~24 draws into the models'
          node tools/asset-pipeline/smoke.js "http://localhost:8888/GeneralsZH.html?diag=1&gxdraws=40&args=-file+Maps/gxtest.map" 120000 map.png 60000 --begin | tee map-smoke.log

      - name: Start a skirmish from the menu
        if: always()
        run: |
          set -o pipefail
          curl -sf http://localhost:8888/GeneralsZH.html > /dev/null || { (cd site && python3 serve.py 8888 >> ../serve.log 2>&1 &); sleep 2; }
          # SOLO PLAY -> SKIRMISH -> PLAY GAME: the skirmish menu (our layouts + Maps/MapCache.ini) must start
          # gxtest.map as GAME_SKIRMISH (mode=2) and reach a running logic loop.
          SMOKE_KEYS=Space SMOKE_CLICKS="512,274;512,412;891,722" SMOKE_WAIT_FOR="inGame=1 isPaused=0" SMOKE_SETTLE_MS=150000 \
          SMOKE_EXPECT="GAMELOGIC: startNewGame:ENTER mode=2;inGame=1 isPaused=0" \
          node tools/asset-pipeline/smoke.js "http://localhost:8888/GeneralsZH.html?diag=1" 120000 skirmish.png 8000 --begin | tee skirmish-smoke.log

      - name: Options and the in-game menu
        if: always()
        run: |
          set -o pipefail
          curl -sf http://localhost:8888/GeneralsZH.html > /dev/null || { (cd site && python3 serve.py 8888 >> ../serve.log 2>&1 &); sleep 2; }
          # OPTIONS from the main menu (OptionsMenu.wnd: init reaches the advanced checkboxes), KEYBOARD
          # (the hotkey reference, a command picked) and BACK to OPTIONS, ESC back;
          # then a skirmish, where ESC must open the quit menu (CommandMap.ini binds it, the engine
          # must be "active") and its Options button the options screen again. Then back in the match:
          # clicks on the ground, the HUD and a unit, ` (diplomacy) and Enter (chat) — any page error fails.
          UI_EXPECT="OptionsMenu.wnd:Check3DShadows;SHELL: doPush 'Menus/KeyboardOptionsMenu.wnd' -> created;KeyboardOptionsMenu.wnd:ButtonBack;KEYS: meta OPTIONS;QUITMENU: toggle visible=0 canOpen=1;KEYS: meta DIPLOMACY;KEYS: meta CHAT_EVERYONE" \
          node tools/asset-pipeline/ui-script.js "http://localhost:8888/GeneralsZH.html?diag=1" \
            "click 512,412;shot options.png;click 655,531;wait 1000;click 325,174;shot keyboard.png;click 795,681;wait 1000;shot options-back.png;key Escape;click 512,274;click 512,412;click 891,722;waitfor 150000 inGame=1 isPaused=0;wait 3000;key Escape;shot quitmenu.png;click 512,384;shot options-ingame.png;key Escape;click 512,261;wait 2000;click 600,400;click 820,640;click 300,700;click 470,420;key Backquote;shot diplomacy.png;key Backquote;key Enter;shot chat.png;key Escape;wait 3000;shot clicks.png;key I;wait 1500;shot dozer.png" \
            | tee ui-smoke.log

      - name: Save and load a game
        if: always()
        run: |
          set -o pipefail
          curl -sf http://localhost:8888/GeneralsZH.html > /dev/null || { (cd site && python3 serve.py 8888 >> ../serve.log 2>&1 &); sleep 2; }
          # a skirmish; ESC > SAVE/LOAD > SAVE GAME with the default description (written to
          # /userdata/save, flushed to IndexedDB); SAVE/LOAD again > LOAD GAME on the new row: the
          # match must come back (GameStateMap extracts the embedded map next to the save). Then a
          # page reload (same profile) and MAIN MENU > LOAD REPLAY > LOAD GAME (SaveLoad.wnd) loads it
          # once more from the shell (no confirm there; the last waitfor can only be met by that load).
          UI_EXPECT="startNewGame:ENTER mode=2 save=1;SAVEGAME: loading block 'CHUNK_GhostObject'" \
          node tools/asset-pipeline/ui-script.js "http://localhost:8888/GeneralsZH.html?diag=1" \
            "click 512,274;click 512,412;click 891,722;waitfor 150000 inGame=1 isPaused=0;wait 3000;key Escape;click 512,323;click 272,612;shot savedesc.png;click 489,404;wait 4000;click 512,323;click 512,148;shot saveload.png;click 431,612;click 489,404;waitfor 150000 inGame=1 isPaused=0;wait 3000;shot loaded.png;reload;click 512,366;click 512,272;wait 1000;shot saveload-shell.png;click 431,612;waitfor 150000 inGame=1 isPaused=0;wait 3000;shot loaded-shell.png" \
            | tee saveload-smoke.log

      - name: End a match (score screen, save and play a replay)
        if: always()
        run: |
          set -o pipefail
          curl -sf http://localhost:8888/GeneralsZH.html > /dev/null || { (cd site && python3 serve.py 8888 >> ../serve.log 2>&1 &); sleep 2; }
          # a skirmish; ESC > EXIT MISSION > YES pushes ScoreScreen.wnd (GameLogic::clearGameData);
          # SAVE REPLAY > name > Save copies the recorded replay (replays/00000000.rep) and flushes it
          # to IndexedDB; the list shows it on reopen; BACK, then OK leaves the score screen. Then
          # BACK > LOAD REPLAY > LOAD (ReplayMenu.wnd): DOWNLOAD > YES hands the replay to the browser,
          # LOAD on the first row plays it back (no "older replay version" prompt: the header must
          # match this build) — startNewGame in mode 3 (GAME_REPLAY); the recorded match is short,
          # so the replay may already be over by the time a TICK-DIAG line would show it.
          UI_EXPECT="SHELL: doPush 'Menus/ScoreScreen.wnd' -> created;/userdata/replays/gxreplay.rep;ScoreScreen.wnd:ButtonOk;SHELL: doPush 'Menus/ReplayMenu.wnd' -> created;DOWNLOAD: 00000000.rep;ReplayMenu.wnd:ButtonLoadReplay;startNewGame:ENTER mode=3" \
          node tools/asset-pipeline/ui-script.js "http://localhost:8888/GeneralsZH.html?diag=1" \
            "click 512,274;click 512,412;click 891,722;waitfor 150000 inGame=1 isPaused=0;wait 3000;key Escape;click 512,505;click 340,465;wait 6000;shot score.png;click 733,645;wait 1000;type gxreplay;click 376,599;wait 3000;js new Promise(r=>{const q=indexedDB.open('/userdata')
          q.onsuccess=()=>{const t=q.result.transaction('FILE_DATA').objectStore('FILE_DATA').getAllKeys()
          t.onsuccess=()=>r(t.result.filter(k=>k.includes('replays')))}
          q.onerror=()=>r('err')});click 733,645;wait 1000;shot replay.png;click 648,599;click 906,714;wait 3000;shot after-score.png;click 130,720;wait 3000;click 512,366;click 512,318;wait 2000;shot replaymenu.png;click 614,663;click 340,465;wait 2000;click 174,663;wait 6000;shot replay-playing.png" \
            | tee score-smoke.log

      - name: Build a barracks
        if: always()
        run: |
          set -o pipefail
          curl -sf http://localhost:8888/GeneralsZH.html > /dev/null || { (cd site && python3 serve.py 8888 >> ../serve.log 2>&1 &); sleep 2; }
          # a skirmish; H (command centre), I (the idle dozer), the BARRACKS button (slot 3 for every
          # side), then placement spots tried in turn until one is legal — start positions are random
          # (tryclick stops once "CONSTRUCTION: started" was logged). The site gets its scaffolding
          # (placeholder-models.ts) while the barracks rises out of the ground.
          UI_EXPECT="CONSTRUCTION: started" \
          node tools/asset-pipeline/ui-script.js "http://localhost:8888/GeneralsZH.html?diag=1" \
            "click 512,274;click 512,412;click 891,722;waitfor 150000 inGame=1 isPaused=0;wait 3000;key H;wait 1500;key I;wait 1500;click 490,627;wait 500;shot placement.png;tryclick 600,420 CONSTRUCTION: started;wait 1500;tryclick 450,460 CONSTRUCTION: started;wait 1500;tryclick 640,330 CONSTRUCTION: started;wait 1500;tryclick 380,330 CONSTRUCTION: started;wait 60000;shot construction.png" \
            | tee build-smoke.log

      - name: Audio (music, UI and world sounds)
        if: always()
        run: |
          set -o pipefail
          curl -sf http://localhost:8888/GeneralsZH.html > /dev/null || { (cd site && python3 serve.py 8888 >> ../serve.log 2>&1 &); sleep 2; }
          # free set: AudioZH.big / MusicZH.big (audio.ts). Menu: the shell track is fetched from the
          # archive and plays (output level > 0). SOLO PLAY: a UI click sample plays and ends. Skirmish:
          # play USA (Skirmish.ini, PlayerTemplate 2: GLA's worker has no 3D move sound), select the dozer
          # (voice), send it off twice (DozerUSAMoveStart, a world sound), then 3D samples must have ended
          # too — their end-of-sample callbacks are what free the engine's 3D channels.
          C="(w=>(s=>'AUDIOCHECK '+w+' '+JSON.stringify(s))(GX_audioStats()))"
          UI_EXPECT="AUDIO: stream;AUDIOCHECK menu;AUDIOCHECK click;AUDIOCHECK game" \
          node tools/asset-pipeline/ui-script.js "http://localhost:8888/GeneralsZH.html?diag=1" \
            "wait 8000;js $C('menu');js FS.writeFile('/userdata/Skirmish.ini','PlayerTemplate = 2\\n');click 512,274;wait 1500;js $C('click');click 512,412;click 891,722;waitfor 150000 inGame=1 isPaused=0;wait 3000;key I;wait 1000;click 600,420;wait 1500;key I;click 420,330;wait 20000;js $C('game');shot audio-game.png" \
            | tee audio-smoke.log
          python3 tools/asset-pipeline/check-audio.py audio-smoke.log | tee audio-check.log

      - name: Night and snow maps
        if: always()
        run: |
          set -o pipefail
          curl -sf http://localhost:8888/GeneralsZH.html > /dev/null || { (cd site && python3 serve.py 8888 >> ../serve.log 2>&1 &); sleep 2; }
          # gxnight (time of day 4: moonlight, every object on its NIGHT model) and gxsnow (snowy weather:
          # SNOW models, GxSnow terrain, a map.ini that turns the snowfall on) — variants.ts / map.ts.
          for m in gxnight gxsnow; do
            SMOKE_EXPECT="GAMELOGIC: startNewGame:ENTER;inGame=1 isPaused=0" SMOKE_WAIT_FOR="inGame=1 isPaused=0" \
            node tools/asset-pipeline/smoke.js "http://localhost:8888/GeneralsZH.html?diag=1&args=-file+Maps/$m.map" 120000 $m.png 90000 --begin | tee $m-smoke.log
          done

      - name: Launcher (free set, offline, own files)
        if: always()
        run: |
          set -o pipefail
          curl -sf http://localhost:8888/GeneralsZH.html > /dev/null || { (cd site && python3 serve.py 8888 >> ../serve.log 2>&1 &); sleep 2; }
          # web/launcher: download the free set into OPFS and boot on it; again with the network off
          # (service worker + stored set); then the free archives picked as "own files".
          node tools/asset-pipeline/launcher-smoke.js http://localhost:8888/ free-out/assets | tee launcher-smoke.log

      - name: Check the terrain is visible
        if: always()
        run: |
          set -o pipefail
          python3 -m pip install --quiet pillow
          python3 tools/asset-pipeline/check-map-shot.py map.png | tee map-check.log || { sed "s/^/::error title=map-check::/" map-check.log; exit 1; }
          sed "s/^/::notice title=map-check::/" map-check.log

      # Surface the interesting console lines as check-run annotations (readable through the API without
      # downloading artifacts): failures as errors, load/tick progress as notices. One step per log, since
      # GitHub keeps at most 10 annotations of each level per step — and about 50 per job, so the
      # notices stay short: the later steps' errors must still fit.
      - name: Annotate menu smoke
        if: always()
        run: |
          f=smoke.log; [ -f "$f" ] || exit 0
          grep -E "FATAL|INI ERROR|PAGEERROR|\[MessageBox\]|expected console line|VERDICT: FAIL|begin failed" "$f" | cut -c1-900 | head -10 | sed "s/^/::error title=$f::/"
          grep -E "GBM_SELECTED|Clearing|VERDICT|UI STATE" "$f" | cut -c1-900 | tail -3 | sed "s/^/::notice title=$f::/"

      - name: Annotate map smoke
        if: always()
        run: |
          f=map-smoke.log; [ -f "$f" ] || exit 0
          grep -E "FATAL|INI ERROR|PAGEERROR|\[MessageBox\]|expected console line|VERDICT: FAIL|begin failed" "$f" | cut -c1-900 | head -10 | sed "s/^/::error title=$f::/"
          grep -E "LOAD: progress|GAMELOGIC:" "$f" | cut -c1-900 | tail -2 | sed "s/^/::notice title=$f::/"
          grep -E "TICK-DIAG|VERDICT" "$f" | cut -c1-900 | tail -2 | sed "s/^/::notice title=$f::/"

      - name: Annotate skirmish smoke
        if: always()
        run: |
          f=skirmish-smoke.log; [ -f "$f" ] || exit 0
          grep -E "FATAL|INI ERROR|PAGEERROR|\[MessageBox\]|expected console line|VERDICT: FAIL|begin failed" "$f" | cut -c1-900 | head -10 | sed "s/^/::error title=$f::/"
          grep -E "GBM_SELECTED|GAMELOGIC: startNewGame:ENTER|TICK-DIAG|VERDICT" "$f" | cut -c1-900 | tail -3 | sed "s/^/::notice title=$f::/"

      - name: Annotate options / in-game menu
        if: always()
        run: |
          f=ui-smoke.log; [ -f "$f" ] || exit 0
          grep -E "FATAL|PAGEERROR|expected console line|UI SCRIPT: FAIL" "$f" | cut -c1-900 | head -10 | sed "s/^/::error title=$f::/"
          grep -E "KEYS: meta|QUITMENU:|UI SCRIPT" "$f" | cut -c1-900 | tail -3 | sed "s/^/::notice title=$f::/"

      - name: Annotate save / load
        if: always()
        run: |
          f=saveload-smoke.log; [ -f "$f" ] || exit 0
          grep -E "FATAL|PAGEERROR|expected console line|waitfor timed out|UI SCRIPT: FAIL|SAVEGAME: (error|GameStateMap throw)" "$f" | cut -c1-900 | head -10 | sed "s/^/::error title=$f::/"
          grep -E "SAVEGAME: map in save|startNewGame:ENTER|UI SCRIPT" "$f" | cut -c1-900 | tail -3 | sed "s/^/::notice title=$f::/"

      - name: Annotate score screen
        if: always()
        run: |
          f=score-smoke.log; [ -f "$f" ] || exit 0
          grep -E "FATAL|PAGEERROR|expected console line|waitfor timed out|UI SCRIPT: FAIL" "$f" | cut -c1-900 | head -10 | sed "s/^/::error title=$f::/"
          grep -E "SHELL: (push|doPush)|RECORDER: start|js:|UI SCRIPT" "$f" | cut -c1-900 | tail -4 | sed "s/^/::notice title=$f::/"

      - name: Annotate construction
        if: always()
        run: |
          f=build-smoke.log; [ -f "$f" ] || exit 0
          grep -E "FATAL|PAGEERROR|expected console line|waitfor timed out|UI SCRIPT: FAIL" "$f" | cut -c1-900 | head -10 | sed "s/^/::error title=$f::/"
          grep -E "CONSTRUCTION:|tryclick|UI SCRIPT" "$f" | cut -c1-900 | tail -8 | sed "s/^/::notice title=$f::/"

      - name: Annotate launcher
        if: always()
        run: |
          f=launcher-smoke.log; [ -f "$f" ] || exit 0
          grep -E "FATAL|PAGEERROR|LAUNCHER SMOKE: FAIL|NO MAIN MENU|not ready|did not finish" "$f" | cut -c1-900 | head -10 | sed "s/^/::error title=$f::/"
          grep -E "\[LSMOKE\].*(main menu|service worker)|LAUNCHER SMOKE" "$f" | cut -c1-900 | tail -4 | sed "s/^/::notice title=$f::/"

      - name: Annotate audio
        if: always()
        run: |
          for f in audio-smoke.log audio-check.log; do [ -f "$f" ] || continue
            grep -E "FATAL|PAGEERROR|expected console line|waitfor timed out|UI SCRIPT: FAIL|AUDIO CHECK: FAIL|AUDIO: .*failed" "$f" | cut -c1-900 | head -6 | sed "s/^/::error title=$f::/"
          done
          [ -f audio-check.log ] && grep -E "^(menu|click|game):|AUDIO CHECK" audio-check.log | cut -c1-900 | tail -4 | sed "s/^/::notice title=audio::/" || true

      - name: Annotate model draws
        if: always()
        run: |
          f=map-smoke.log; [ -f "$f" ] || exit 0
          # the lit draws of the first in-game frame (models): GL state, material and lights
          grep -E "DRAW-DIAG\[DIP\].*light=1|DRAW-DIAG   (material|light[0-9])" "$f" | cut -c1-900 | head -10 | sed "s/^/::notice title=model draws::/"

      - name: Annotate texgen draws
        if: always()
        run: |
          f=map-smoke.log; [ -f "$f" ] || exit 0
          # draws with generated texture coordinates (shroud / cloud pass): matrix and the first vertex's uv
          grep -E "DRAW-DIAG   stage[0-9]" "$f" | cut -c1-900 | head -8 | sed "s/^/::notice title=texgen draws::/"
          grep -E "SHROUD:" "$f" | cut -c1-900 | tail -2 | sed "s/^/::notice title=texgen draws::/"

      - name: Upload screenshot and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-smoke
          path: |
            menu.png
            map.png
            skirmish.png
            options.png
            keyboard.png
            options-back.png
            quitmenu.png
            options-ingame.png
            diplomacy.png
            chat.png
            clicks.png
            dozer.png
            placement.png
            construction.png
            gxnight.png
            gxsnow.png
            savedesc.png
            saveload.png
            loaded.png
            saveload-shell.png
            loaded-shell.png
            score.png
            replay.png
            after-score.png
            replaymenu.png
            replay-playing.png
            smoke.log
            ui-smoke.log
            saveload-smoke.log
            score-smoke.log
            build-smoke.log
            gxnight-smoke.log
            gxsnow-smoke.log
            map-smoke.log
            skirmish-smoke.log
            launcher-smoke.log
            audio-smoke.log
            audio-game.png
            launcher-*.png
            serve.log
