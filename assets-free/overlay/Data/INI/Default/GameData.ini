; free-assets: Data\INI\Default\GameData.ini is loaded before the corpus GameData.ini, which
; does not set ShroudOn, so the value here sticks. The shroud is on: gxtest.map's command
; centers, dozers and infantry give vision, and the GLES shim projects the shroud texture
; (texture transforms) since the D3DTSS ids were fixed.
GameData
  MapName = NoName.map
  ShroudOn = Yes
End
