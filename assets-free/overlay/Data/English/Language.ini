; free-assets: language/font definitions for the web port.
; On the web, fonts are rasterised with HTML5 Canvas from the family named here
; (see render2dsentence.cpp, window.gxFontFamily), so no font files are needed.
Language English
  UnicodeFontName           = Arial
  MilitaryCaptionSpeed      = 1
  UseHardWordWrap           = No
  ResolutionFontAdjustment  = 0.7
  CopyrightFont             = "Arial" 10 No
  MessageFont               = "Arial" 12 Yes
  MilitaryCaptionTitleFont  = "Arial" 14 Yes
  MilitaryCaptionDelayMS    = 750
  MilitaryCaptionFont       = "Arial" 12 No
  SuperweaponCountdownNormalFont = "Arial" 12 Yes
  SuperweaponCountdownReadyFont  = "Arial" 12 Yes
  NamedTimerCountdownNormalFont  = "Arial" 12 Yes
  NamedTimerCountdownReadyFont   = "Arial" 12 Yes
  DrawableCaptionFont       = "Arial" 10 Yes
  DefaultWindowFont         = "Arial" 12 Yes
  DefaultDisplayStringFont  = "Arial" 12 Yes
  TooltipFontName           = "Arial" 10 No
  NativeDebugDisplay        = "Arial" 10 No
  DrawGroupInfoFont         = "Arial" 10 Yes
  CreditsTitleFont          = "Arial" 18 Yes
  CreditsMinorTitleFont     = "Arial" 14 Yes
  CreditsNormalFont         = "Arial" 12 No
End
