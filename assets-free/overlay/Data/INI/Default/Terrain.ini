; free-assets: the engine loads Data\INI\Default\Terrain.ini before Data\INI\Terrain.ini
; (GameEngine.cpp initSubsystem TheTerrainTypes), so this is where the free set adds
; its own terrain types without replacing the corpus file. Textures live in
; Art\Terrain\ and are generated by tools/asset-pipeline/tga.ts.

Terrain GxGrass
  Texture = gxgrass.tga
  Class = GRASS
End
