; free-assets: Data\INI\Default\GameData.ini is loaded before the corpus GameData.ini, which
; does not set ShroudOn, so the value here sticks. The free map has no units yet, so with the
; shroud on the whole terrain would be unexplored (black); keep it off until the map has
; vision-giving objects.
GameData
  MapName = NoName.map
  ShroudOn = Yes
End
